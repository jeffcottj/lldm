name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build browser assets
        run: pnpm --filter @lldm/web build
      - name: Check deployment configuration
        run: pnpm config:check
      - name: Discover browser scenarios
        run: pnpm playwright:check
      - name: Check generated documentation
        run: pnpm docs:check
